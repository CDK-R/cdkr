name: R-CMD-check

on:
  push:
    branches: [main, master, j17, "release/**"]
  pull_request:
    branches: [main, master, j17]

jobs:
  R-CMD-check:
    runs-on: macOS-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17']
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Set up compiler JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages(c("remotes", "rcmdcheck"))
          remotes::install_github("CDK-R/rcdklibs@bf933d76929ab9a5835881a1a099e27eccfe849a",
                                 upgrade = "never")
          remotes::install_deps("rcdk", dependencies = TRUE, upgrade = "never")
      - name: Build against pinned rcdklibs
        shell: bash
        run: |
          CDK_JARS="$(Rscript -e 'cat(system.file("cont", package="rcdklibs"))')"
          ant -f rcdkjar/build.xml "-Dcdk.jars=$CDK_JARS" clean jar
      - name: Set up runtime JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Check
        shell: Rscript {0}
        run: |
          stopifnot(as.character(packageVersion("rcdklibs")) == "2.14.1")
          stopifnot(packageDescription("rcdklibs")$RemoteSha ==
                    "bf933d76929ab9a5835881a1a099e27eccfe849a")
          rcmdcheck::rcmdcheck("rcdk", args = "--no-manual", error_on = "warning")
